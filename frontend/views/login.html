<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PocketWise</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/bootstrap-icons.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">
    <div class="auth-wrapper">
        <div class="card border-0 shadow overflow-hidden" style="max-width: 860px; width: 100%; border-radius: 14px;">
            <div class="row g-0">
                <!-- Left Banner with Image -->
                <div class="col-md-5 d-none d-md-flex flex-column justify-content-between p-4 text-white" style="background: linear-gradient(145deg, #059669 0%, #047857 100%);">
                    <div>
                        <div class="d-flex align-items-center gap-2 mb-3">
                            <i class="bi bi-wallet2 fs-3 text-white"></i>
                            <span class="fs-4 fw-bold">PocketWise</span>
                        </div>
                        <h5 class="fw-bold text-white mb-2">Smart Personal Finance</h5>
                        <p class="text-white-50 small mb-3">Empowering working professionals and households with real-time expense tracking and budget intelligence.</p>
                    </div>
                    <div class="text-center my-auto py-2">
                        <img src="{{ url_for('static', filename='img/auth_wallet.jpg') }}" alt="PocketWise Finance" class="img-fluid rounded-3 shadow" style="max-height: 220px; object-fit: cover; width: 90%;">
                    </div>
                    <div class="small text-white-50 text-center pt-2 border-top border-white border-opacity-10">
                        &copy; 2026 PocketWise &bull; Secure &amp; Fast
                    </div>
                </div>

                <!-- Right Login Form -->
                <div class="col-12 col-md-7 p-4 p-lg-5 bg-white">
                    <div class="text-center mb-4 d-md-none">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-2" style="width: 50px; height: 50px;">
                            <i class="bi bi-wallet2 fs-3"></i>
                        </div>
                        <h4 class="fw-bold mb-1 text-primary">PocketWise</h4>
                    </div>

                    <div class="mb-4">
                        <h4 class="fw-bold mb-1">Welcome back</h4>
                        <p class="text-muted small mb-0">Sign in to manage your budget and track expenses</p>
                    </div>

                    <div id="alertBox" class="alert alert-danger d-none" role="alert"></div>

                    <form id="loginForm">
                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold" style="font-size: 0.88rem;">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" class="form-control" id="email" placeholder="rahul@pocketwise.io" required autofocus>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold" style="font-size: 0.88rem;">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="bi bi-lock"></i></span>
                                <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3" id="submitBtn">
                            <i class="bi bi-box-arrow-in-right me-1"></i>Sign In
                        </button>
                    </form>

                    <div class="position-relative text-center my-3">
                        <hr class="text-muted opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-2 text-muted" style="font-size: 0.78rem;">OR</span>
                    </div>

                    <!-- Login with Google Button -->
                    <button type="button" class="btn btn-outline-secondary w-100 py-2 fw-semibold d-flex align-items-center justify-content-center gap-2 bg-white text-dark border shadow-sm" id="googleLoginBtn" style="border-color: #dadce0 !important; font-size: 0.9rem;">
                        <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                            <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/>
                            <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                            <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                            <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
                        </svg>
                        <span>Continue with Google</span>
                    </button>

                    <div class="text-center mt-3" style="font-size: 0.88rem;">
                        <span class="text-muted">New to PocketWise?</span>
                        <a href="{{ url_for('register_page') }}" class="text-primary fw-semibold text-decoration-none">Create an Account</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/bootstrap.bundle.min.js') }}"></script>
    <script>
        const loginForm = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');
        const googleLoginBtn = document.getElementById('googleLoginBtn');

        function showAlert(msg, isError = true) {
            alertBox.className = `alert alert-${isError ? 'danger' : 'success'} d-block`;
            alertBox.textContent = msg;
        }

        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            alertBox.classList.add('d-none');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-1"></span>Signing In...';

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    showAlert(data.message || 'Login failed. Please check credentials.');
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Sign In';
                }
            } catch (err) {
                showAlert('Network error or server unreachable.');
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="bi bi-box-arrow-in-right me-1"></i>Sign In';
            }
        });

        function resetGoogleBtn() {
            googleLoginBtn.disabled = false;
            googleLoginBtn.innerHTML = `
                <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg">
                    <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.616z" fill="#4285F4"/>
                    <path d="M9 18c2.43 0 4.467-.806 5.956-2.184l-2.908-2.258c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
                    <path d="M3.964 10.707c-.18-.54-.282-1.117-.282-1.707s.102-1.167.282-1.707V4.961H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.039l3.007-2.332z" fill="#FBBC05"/>
                    <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.961L3.964 7.293C4.672 5.166 6.656 3.58 9 3.58z" fill="#EA4335"/>
                </svg>
                <span>Continue with Google</span>
            `;
        }

        googleLoginBtn.addEventListener('click', async function() {
            googleLoginBtn.disabled = true;
            googleLoginBtn.innerHTML = '<span class="spinner-border spinner-border-sm me-2 text-primary"></span>Connecting with Google...';
            try {
                const res = await fetch('/api/auth/google', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ email: 'rahul.sharma@gmail.com', name: 'Rahul Sharma' })
                });
                const data = await res.json();
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    showAlert(data.message || 'Google Sign-In failed.');
                    resetGoogleBtn();
                }
            } catch (err) {
                showAlert('Could not connect to Google authentication service.');
                resetGoogleBtn();
            }
        });
    </script>
</body>
</html>
